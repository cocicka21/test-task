spring:
  application:
    name: testtask
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: 'org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl'
  datasource:
    url: jdbc:postgresql://postgresDB:5432/testtaskDB
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

elasticsearch:
  url: http://elasticsearch:9200

server:
  port: 8090
  servlet:
    context-path: /api